name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 已迁移到 26.04，setup-python 没有 3.9 的 x64 包；
        # 固定 22.04，保证 Python 3.9 仍可安装。
        os: [ubuntu-22.04, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q gpufinder

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_no_secrets.py

  macos-build:
    name: Build menu bar app
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: ./macos/build.sh
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "dist/GPU Finder.app" "dist/GPU-Finder.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-Finder-app
          path: dist/GPU-Finder.zip
          if-no-files-found: error
