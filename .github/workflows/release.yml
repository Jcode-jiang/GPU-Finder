name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: python3 -m unittest discover -s tests
      - name: Build app
        run: ./macos/build.sh
      - name: Package app
        id: package
        run: |
          OUT=$(./scripts/package_release.sh | tee /tmp/package.log | tail -2)
          cat /tmp/package.log
          echo "name=$(basename "$(grep '^▸ 产物:' /tmp/package.log | sed 's/^▸ 产物: //')")" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*
      - name: Check existing release
        id: existing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}")
          exists=false
          if [ "$code" = "200" ]; then
            exists=true
          else
            exists=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" | \
              python3 -c "import json,sys; name=sys.argv[1]; print('true' if any(r.get('tag_name')==name for r in json.load(sys.stdin)) else 'false')" "${GITHUB_REF_NAME}")
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          body: |
            ⚠️ 该构建为 Universal（arm64 + x86_64），使用 ad-hoc 签名，未经过 Apple 公证。
            需要 Python 3.9+，首次启动请阅读 README 的系统要求与隐私/费用说明。
