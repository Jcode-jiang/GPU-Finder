name: Feature request
description: 新平台、新功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 例如：希望支持 XX 平台的 5090 行情
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 范围
      options:
        - 新平台行情
        - 一键租卡
        - Dashboard / 状态栏 UI
        - CLI / API
        - 文档 / 构建
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我没有在 Issue 中粘贴任何凭据或个人信息
          required: true
