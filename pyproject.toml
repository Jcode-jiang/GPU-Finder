[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpufinder"
version = "2.0.1"
description = "多平台 GPU 算力行情与一键租卡：AutoDL、矩池云、优云智算、恒源云"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GPU Finder" }]
keywords = ["gpu", "autodl", "matpool", "compshare", "gpushare", "macos"]
dependencies = []

[project.scripts]
gpufinder = "gpufinder.cli:main"

[tool.setuptools]
packages = ["gpufinder", "gpufinder.providers"]
include-package-data = true

[tool.setuptools.package-data]
gpufinder = ["web/*"]
