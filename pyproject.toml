[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpufinder"
version = "2.1.0"
description = "多平台 GPU 算力行情与一键租卡：AutoDL、矩池云、优云智算、恒源云"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GPU Finder" }]
keywords = ["gpu", "autodl", "matpool", "compshare", "gpushare", "macos"]
dependencies = []

[project.scripts]
gpufinder = "gpufinder.cli:main"

[tool.setuptools]
packages = ["gpufinder", "gpufinder.providers"]
include-package-data = true

[tool.setuptools.package-data]
gpufinder = ["web/*"]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = ["dist", "build", ".devhome"]

[tool.ruff.lint]
# 只保留能发现真实错误的规则；格式/风格交给编辑器。
select = ["E9", "F63", "F7", "F82"]
